<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login page</title>
  <link
  rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <link rel="stylesheet" href="./css/New_pass.css">
</head>
<body>
  <div class="container">
    <div class="row">
      <div class="header">
        <img src="imges/To-Do-Logo 2.png" alt="Logo page" class="header-logo">
      </div>
  
      <form id="loginForm" novalidate class="login-form">
        <div class="password-group">
          <label for="password" class="get-password__text">NEW PASSWORD</label>
          <input type="password" id="password" class="get-password__input" required>
          <label for="confirmPassword" class="get-password__text">CONFIRM NEW PASSWORD</label>
          <input type="password" id="confirmPassword" class="get-password__input" required>
          <span class="password-see" id="passwordSee">
            <i class="fas fa-eye"></i>
          </span>
          <small class="error-msg" id="passwordError"></small>
        </div>

        <button type="submit" class="login-btn" id="submitBtn">Register</button>
      </form>
    </div> 
    
  </div>
  <script src="./script/New_pass.js"></script>
</body>
</html>
