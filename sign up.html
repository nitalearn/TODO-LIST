<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login page</title>
  <link
  rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <link rel="stylesheet" href="./css/sign_up.css">
</head>
<body>
  <div class="container">
    <div class="row">
      <div class="header">
        <img src="imges/To-Do-Logo 2.png" alt="Logo page" class="header-logo">
      </div>
  
      <form id="loginForm" novalidate class="login-form">
        <div class="username-group">
          <label for="text" class="get-username__text">USERNAME</label>
          <input type="text" id="username" class="get-username__input" required>
          <small class="error-msg" id="usernameError"></small>
        </div>

        <div class="email-group">
          <label for="email" class="get-email__text">EMAIL</label>
          <input type="email" id="email" class="get-email__input" required>
          <small class="error-msg" id="emailError"></small>
        </div>
      
        <div class="password-group">
          <label for="password" class="get-password__text">PASSWORD</label>
          <input type="password" id="password" class="get-password__input" required>
          <label for="confirmPassword" class="get-password__text">PASSWORD</label>
          <input type="password" id="confirmPassword" class="get-password__input" required>
          <span class="password-see" id="passwordSee">
            <i class="fas fa-eye"></i>
          </span>
          <small class="error-msg" id="passwordError"></small>
        </div>

        <button type="submit" class="login-btn" id="submitBtn">Sign in</button>
      </form>

      <div class="sign-in">
        Do you have an account?
        <a href="#" class="sign-in__link">Login now.</a>
      </div>
    </div> 
    
  </div>
  <script src="./script/sign_up.js"></script>
</body>
</html>
